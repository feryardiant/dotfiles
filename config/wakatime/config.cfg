[settings]
status_bar_coding_activity = true
import_cfg = /Users/fery/Config/dotfiles/config/wakatime/private.cfg

exclude =
    /build/
    ^COMMIT_EDITMSG$
    ^TAG_EDITMSG$
    ^/(etc|opt|var)/
    .*\.old$
    (^|/)_\.
    (^|/)\._

include =
    ^/Users/fery/(Config|Workspace)/.*
    ^/Volumes/[^/]+/Workspace/.*

[git]
submodules_disabled = true

[projectmap]
Codes\/([\w0-9-_ ]*) = My_{0}
Config\/([\w0-9-_ ]*) = Config_{0}
Contribs\/([\w0-9-_ ]*) = Contrib_{0}
Creasico\/([\w0-9-_ ]*) = Creasi_{0}
Personal\/([\w0-9-_ ]*) = My_{0}
Playground\/([\w0-9-_ ]*) = Playground_{0}
Projects\/([\w0-9-_ ]*) = Project_{0}
Sandbox\/([\w0-9-_ ]*) = Sandbox_{0}
XYZ\/([\w0-9-_ ]*) = XYZ_{0}

[internal]
backoff_at      =
backoff_retries = 0
